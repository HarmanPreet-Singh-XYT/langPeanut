services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        langpeanut_local: ../langpeanut_local
    # Published on the host so an existing reverse proxy (nginx, etc.) can
    # target it directly when you run with --profile "" (Caddy disabled).
    # Bound to loopback only — put a proxy in front for real deployments.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      # Docker socket: lets the trusted worker process spawn per-job
      # langpeanut-runner containers (sandboxes). The runner containers
      # themselves do NOT get this socket mounted (see Dockerfile.runner).
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env          # MASTER_KEY, GITHUB_APP_ID, etc. — never committed to git
    environment:
      - DATABASE_PATH=/data/langpeanut.db
      - MIRRORS_DIR=/data/mirrors
      - JOBS_DIR=/data/jobs
      - GITHUB_APP_PRIVATE_KEY_PATH=/data/github-app.pem
      - RUNNER_IMAGE=langpeanut-runner:latest
      - LISTEN_ADDR=:8080
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional built-in reverse proxy + automatic Let's Encrypt TLS.
  # Skip this entirely if the VPS already has nginx (or another proxy)
  # configured with HTTPS — start the stack with `docker compose up -d`
  # (no --profile flag) and point your existing proxy at 127.0.0.1:8080
  # instead. See DEPLOYMENT.md §7 for both paths.
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
