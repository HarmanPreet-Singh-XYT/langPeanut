# Example nginx server block for langpeanut-cloud.
#
# Use this instead of the bundled Caddy container when the VPS already has
# nginx configured with HTTPS (e.g. via certbot). Drop this into
# /etc/nginx/sites-available/, adjust server_name and cert paths, then
# symlink into sites-enabled and reload nginx.
#
# Start the app stack WITHOUT the caddy profile so nothing else binds
# ports 80/443:
#   docker compose up -d --build
#
# The app container publishes to 127.0.0.1:8080 (see docker-compose.yml),
# which this config proxies to.

server {
    listen 80;
    server_name langpeanut.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name langpeanut.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/langpeanut.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langpeanut.yourdomain.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GitHub webhook deliveries and job polling can run long; keep this
        # generous rather than timing out a slow upstream response.
        proxy_read_timeout 90s;
    }
}
