name: Deploy langPeanut Cloud to Google Compute Engine (GCE)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'langpeanut-cloud/**'
      - 'langpeanut_local/**'
      - '.github/workflows/deploy-gce.yml'
  workflow_dispatch:
    inputs:
      enable_caddy:
        description: "Enable bundled Caddy for automatic Let's Encrypt HTTPS (yes/no)"
        required: false
        default: 'yes'
      custom_branch:
        description: 'Branch to deploy (leave empty for default)'
        required: false
        default: ''

concurrency:
  group: deploy-gce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCE VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Authenticate to Google Cloud ──────────────────────────────────────────
      # You can provide either a Service Account JSON Key via GCP_SA_KEY
      # OR use Workload Identity Federation (WIF) via GCP_WIF_PROVIDER + GCP_WIF_SERVICE_ACCOUNT
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      # ── Deploy to Compute Engine Instance via gcloud compute ssh ──────────────
      - name: Execute Deployment on GCE VM
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE_NAME }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          DEPLOY_PATH: ${{ secrets.GCE_DEPLOY_PATH || '/opt/langpeanut' }}
          
          # Secrets for .env
          ENV_FILE: ${{ secrets.ENV_FILE || secrets.GCP_ENV_FILE }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID || secrets.APP_ID || secrets.BOT_APP_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET || secrets.BOT_WEBHOOK_SECRET }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_CLIENT_ID || secrets.APP_CLIENT_ID || secrets.CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET || secrets.GH_CLIENT_SECRET || secrets.APP_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://34.135.83.146.sslip.io' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          
          # GitHub App RSA Private Key PEM
          GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.GH_APP_PRIVATE_KEY_PEM || secrets.APP_PRIVATE_KEY_PEM || secrets.PRIVATE_KEY_PEM || secrets.BOT_PRIVATE_KEY_PEM }}
          
          # Deployment options
          ENABLE_CADDY: ${{ github.event.inputs.enable_caddy || 'yes' }}
          TARGET_BRANCH: ${{ github.event.inputs.custom_branch || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          echo "Connecting to Compute Engine VM: ${GCE_INSTANCE} in zone: ${GCE_ZONE}..."

          # Construct remote bash deployment script
          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" \
            --project="${GCP_PROJECT}" \
            --quiet \
            --command="
              set -euo pipefail

              echo '==> 1. Preparing deployment directory at ${DEPLOY_PATH}...'
              if [ ! -d '${DEPLOY_PATH}' ]; then
                sudo mkdir -p '${DEPLOY_PATH}'
                sudo chown \$(whoami):\$(whoami) '${DEPLOY_PATH}'
              fi

              cd '${DEPLOY_PATH}'

              echo '==> 2. Syncing source repository...'
              if [ ! -d .git ]; then
                git clone '${REPO_URL}' .
              else
                git fetch origin
              fi
              git checkout '${TARGET_BRANCH}'
              git pull origin '${TARGET_BRANCH}'

              cd '${DEPLOY_PATH}/langpeanut-cloud'

              echo '==> 3. Creating persistent data directories...'
              mkdir -p data/mirrors data/jobs

              echo '==> 4. Injecting environment secrets into .env...'
              if [ -n \"${ENV_FILE}\" ]; then
                cat << 'CUSTOM_ENV_EOF' > .env
              ${ENV_FILE}
              CUSTOM_ENV_EOF
              else
                cat << 'ENV_EOF' > .env
              # Auto-generated by GitHub Actions deployment workflow
              MASTER_KEY=${MASTER_KEY}
              GITHUB_APP_ID=${GITHUB_APP_ID}
              GITHUB_APP_PRIVATE_KEY_PATH=/data/github-app.pem
              GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
              GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
              GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
              GITHUB_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
              GITHUB_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
              PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
              SESSION_SECRET=${SESSION_SECRET}
              GEMINI_API_KEY=${GEMINI_API_KEY}
              ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
              OPENAI_API_KEY=${OPENAI_API_KEY}
              DEEPL_API_KEY=${DEEPL_API_KEY}
              HF_TOKEN=${HF_TOKEN}
              LISTEN_ADDR=:8080
              DATABASE_PATH=/data/langpeanut.db
              MIRRORS_DIR=/data/mirrors
              JOBS_DIR=/data/jobs
              RUNNER_IMAGE=langpeanut-runner:latest
              ENV_EOF
              fi
              chmod 600 .env

              if [ -n \"${GITHUB_APP_PRIVATE_KEY_PEM}\" ]; then
                echo '==> 5. Writing GitHub App private key PEM...'
                cat << 'PEM_EOF' > data/github-app.pem
              ${GITHUB_APP_PRIVATE_KEY_PEM}
              PEM_EOF
                chmod 600 data/github-app.pem
              fi

              echo '==> 6. Building sandboxed runner image (langpeanut-runner:latest)...'
              docker build -f Dockerfile.runner -t langpeanut-runner:latest \
                --build-context langpeanut_local=../langpeanut_local .

              echo '==> 7. Launching Docker Compose stack...'
              if [ \"${ENABLE_CADDY}\" = \"yes\" ]; then
                docker compose --profile caddy up -d --build
              else
                docker compose up -d --build
              fi

              echo '==> 8. Verifying application health status...'
              sleep 5
              for i in {1..12}; do
                if curl -sf http://127.0.0.1:8080/health | grep -q 'ok'; then
                  echo '==> SUCCESS: langPeanut Cloud is healthy and running on GCE!'
                  exit 0
                fi
                echo \"Waiting for app to become ready (attempt \$i/12)...\"
                sleep 3
              done

              echo '==> ERROR: Health check failed after deployment!'
              docker compose logs --tail=50 app
              exit 1
            "
