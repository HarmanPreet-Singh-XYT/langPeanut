name: Deploy langPeanut Cloud to Google Compute Engine (GCE)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'langpeanut-cloud/**'
      - 'langpeanut_local/**'
      - '.github/workflows/deploy-gce.yml'
      - '.github/scripts/deploy-gce.sh'
  workflow_dispatch:
    inputs:
      enable_caddy:
        description: "Enable bundled Caddy for automatic Let's Encrypt HTTPS (yes/no)"
        required: false
        default: 'yes'

concurrency:
  group: deploy-gce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GCE VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: langpeanut-cloud/go.sum

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: langpeanut-cloud/web/package-lock.json

      # ── Fast Pre-Compilation on GitHub Actions Runner (4 Fast vCPUs) ──────────
      - name: Build Next.js Web UI
        working-directory: langpeanut-cloud/web
        run: |
          npm ci || npm install
          npm run build

      - name: Compile Linux Binaries with CGO
        working-directory: langpeanut-cloud
        run: |
          mkdir -p bin
          echo "Compiling server binary..."
          CGO_ENABLED=1 CGO_CFLAGS="-O0" GOOS=linux go build -trimpath -ldflags="-s -w" -o bin/langpeanut-cloud ./cmd/server
          echo "Compiling runner binary..."
          CGO_ENABLED=1 CGO_CFLAGS="-O0" GOOS=linux go build -trimpath -ldflags="-s -w" -o bin/langpeanut-runner ./cmd/runner

      - name: Bundle Pre-Compiled Deployment Package
        working-directory: langpeanut-cloud
        run: |
          tar -czf ../deploy-package.tar.gz \
            bin Dockerfile.prebuilt Dockerfile.runner.prebuilt docker-compose.yml Caddyfile web/out

      # ── Authenticate to Google Cloud ──────────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      # ── Provision Pub/Sub webhook intake (idempotent) ─────────────────────────
      # Durable GitHub webhook delivery: the server publishes verified
      # deliveries here instead of processing them inline, so a deploy or
      # restart can't drop a webhook mid-flight. Local dev never touches
      # this — only enabled on the deployed VM via GCP_PROJECT_ID in .env.
      - name: Provision Pub/Sub topic, subscription, and IAM
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE_NAME }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          PUBSUB_WEBHOOK_TOPIC: ${{ secrets.PUBSUB_WEBHOOK_TOPIC || 'langpeanut-webhooks' }}
          PUBSUB_WEBHOOK_SUBSCRIPTION: ${{ secrets.PUBSUB_WEBHOOK_SUBSCRIPTION || 'langpeanut-webhooks-server' }}
        run: |
          set -euo pipefail

          # Enabling the API requires serviceusage.services.enable, which this
          # deploy identity may not have. Best-effort only — if the API is
          # already enabled (or another admin enables it once), this is a
          # no-op; if it's genuinely disabled and this identity can't enable
          # it, the topic/subscription steps below will fail with a clear
          # "API not enabled" error rather than silently doing nothing.
          echo "Ensuring Pub/Sub API is enabled..."
          gcloud services enable pubsub.googleapis.com --project="${GCP_PROJECT}" || \
            echo "Could not enable Pub/Sub API (missing serviceusage permission?) — continuing, assuming it's already enabled."

          echo "Ensuring Pub/Sub topic '${PUBSUB_WEBHOOK_TOPIC}' exists..."
          if gcloud pubsub topics describe "${PUBSUB_WEBHOOK_TOPIC}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            echo "Topic already exists, continuing."
          else
            gcloud pubsub topics create "${PUBSUB_WEBHOOK_TOPIC}" --project="${GCP_PROJECT}"
          fi

          echo "Ensuring Pub/Sub subscription '${PUBSUB_WEBHOOK_SUBSCRIPTION}' exists..."
          if gcloud pubsub subscriptions describe "${PUBSUB_WEBHOOK_SUBSCRIPTION}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            echo "Subscription already exists, continuing."
          else
            gcloud pubsub subscriptions create "${PUBSUB_WEBHOOK_SUBSCRIPTION}" \
              --topic="${PUBSUB_WEBHOOK_TOPIC}" \
              --ack-deadline=30 \
              --project="${GCP_PROJECT}"
          fi

          echo "Granting the VM's attached service account Pub/Sub publisher/subscriber roles..."
          VM_SA=$(gcloud compute instances describe "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" \
            --project="${GCP_PROJECT}" \
            --format='value(serviceAccounts[0].email)')

          gcloud pubsub topics add-iam-policy-binding "${PUBSUB_WEBHOOK_TOPIC}" \
            --project="${GCP_PROJECT}" \
            --member="serviceAccount:${VM_SA}" \
            --role="roles/pubsub.publisher" >/dev/null

          gcloud pubsub subscriptions add-iam-policy-binding "${PUBSUB_WEBHOOK_SUBSCRIPTION}" \
            --project="${GCP_PROJECT}" \
            --member="serviceAccount:${VM_SA}" \
            --role="roles/pubsub.subscriber" >/dev/null

          echo "Pub/Sub provisioning complete (VM SA: ${VM_SA})."

      # ── Deploy Pre-Built Bundle to Compute Engine VM ──────────────────────────
      - name: Execute Deployment on GCE VM
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ secrets.GCE_INSTANCE_NAME }}
          GCE_ZONE: ${{ secrets.GCE_ZONE }}
          
          # Secrets for .env
          ENV_FILE: ${{ secrets.ENV_FILE || secrets.GCP_ENV_FILE }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID || secrets.APP_ID || secrets.BOT_APP_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET || secrets.WEBHOOK_SECRET || secrets.BOT_WEBHOOK_SECRET }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID || secrets.GH_CLIENT_ID || secrets.APP_CLIENT_ID || secrets.CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET || secrets.GH_CLIENT_SECRET || secrets.APP_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG || secrets.APP_SLUG || 'langpeanut-localization-bot' }}
          GITHUB_APP_INSTALL_URL: ${{ secrets.GH_APP_INSTALL_URL || secrets.APP_INSTALL_URL || '' }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://34.135.83.146.sslip.io' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          
          # GitHub App RSA Private Key PEM
          GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.GH_APP_PRIVATE_KEY_PEM || secrets.APP_PRIVATE_KEY_PEM || secrets.PRIVATE_KEY_PEM || secrets.BOT_PRIVATE_KEY_PEM }}

          # Pub/Sub durable webhook intake (cloud-only — leave GCP_PROJECT_ID
          # unset for local dev/other environments to keep webhooks synchronous)
          PUBSUB_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PUBSUB_WEBHOOK_TOPIC: ${{ secrets.PUBSUB_WEBHOOK_TOPIC || 'langpeanut-webhooks' }}
          PUBSUB_WEBHOOK_SUBSCRIPTION: ${{ secrets.PUBSUB_WEBHOOK_SUBSCRIPTION || 'langpeanut-webhooks-server' }}

          # Deployment options
          ENABLE_CADDY: ${{ github.event.inputs.enable_caddy || 'yes' }}
        run: |
          echo "Preparing deployment payload for ${GCE_INSTANCE} (${GCE_ZONE})..."

          # 1. Generate local .env file
          if [ -n "${ENV_FILE}" ]; then
            printf "%s\n" "${ENV_FILE}" > local.env
          else
            cat << 'ENV_BLOCK' > local.env
          MASTER_KEY=${MASTER_KEY}
          GITHUB_APP_ID=${GITHUB_APP_ID}
          GITHUB_APP_PRIVATE_KEY_PATH=/data/github-app.pem
          GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
          GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
          GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
          GITHUB_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
          GITHUB_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
          GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
          GITHUB_APP_INSTALL_URL=${GITHUB_APP_INSTALL_URL}
          PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
          SESSION_SECRET=${SESSION_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          DEEPL_API_KEY=${DEEPL_API_KEY}
          HF_TOKEN=${HF_TOKEN}
          LISTEN_ADDR=:8080
          DATABASE_PATH=/data/langpeanut.db
          MIRRORS_DIR=/data/mirrors
          JOBS_DIR=/data/jobs
          RUNNER_IMAGE=langpeanut-runner:latest
          GCP_PROJECT_ID=${PUBSUB_GCP_PROJECT_ID}
          PUBSUB_WEBHOOK_TOPIC=${PUBSUB_WEBHOOK_TOPIC}
          PUBSUB_WEBHOOK_SUBSCRIPTION=${PUBSUB_WEBHOOK_SUBSCRIPTION}
          ENV_BLOCK
            # Substitute environment variables into local.env
            envsubst < local.env > local.env.tmp && mv local.env.tmp local.env
          fi

          # 2. Generate local PEM file if provided
          if [ -n "${GITHUB_APP_PRIVATE_KEY_PEM}" ]; then
            printf "%s\n" "${GITHUB_APP_PRIVATE_KEY_PEM}" > local_github_app.pem
          else
            touch local_github_app.pem
          fi

          # 3. Transfer pre-built bundle and configs to VM via scp
          echo "Transferring pre-built package to VM..."
          gcloud compute scp deploy-package.tar.gz local.env local_github_app.pem .github/scripts/deploy-gce.sh \
            "${GCE_INSTANCE}:/tmp/" \
            --zone="${GCE_ZONE}" \
            --project="${GCP_PROJECT}" \
            --quiet

          # 4. Execute remote deployment script
          echo "Launching containers on VM..."
          gcloud compute ssh "${GCE_INSTANCE}" \
            --zone="${GCE_ZONE}" \
            --project="${GCP_PROJECT}" \
            --quiet \
            --command="ENABLE_CADDY='${ENABLE_CADDY}' bash /tmp/deploy-gce.sh"
